[package]
edition.workspace = true
license.workspace = true
name = "codex-solver-guard"
version.workspace = true

[lib]
name = "codex_solver_guard"
path = "src/lib.rs"

[[bin]]
name = "ascodex-lease-admin"
path = "src/bin/lease_admin.rs"

[[bin]]
name = "ascodex-stage-admin"
path = "src/bin/stage_admin.rs"

[[bin]]
name = "ascodex-observation-admin"
path = "src/bin/observation_admin.rs"

[[bin]]
name = "ascodex-pool-admin"
path = "src/bin/pool_admin.rs"

[[bin]]
name = "ascodex-wake-admin"
path = "src/bin/wake_admin.rs"

[[bin]]
name = "ascodex-wake-consumer"
path = "src/bin/wake_consumer.rs"

[[bin]]
name = "ascodex-canary-runner"
path = "src/bin/canary_runner.rs"


[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
codex-ascodex-coordination = { workspace = true }
ed25519-dalek = { workspace = true }
hex = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["sqlite"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
